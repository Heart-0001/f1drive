<!DOCTYPE html><html><body style="margin:0;overflow:hidden"><canvas id="c"></canvas>
<script src="../../lib/three.min.js"></script>
<script src="../../js/cockpit.js"></script>
<script>
const q=new URLSearchParams(location.search);
const W=1280,H=720;
const r=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true});
r.setSize(W,H);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x87b8e8);
scene.add(new THREE.HemisphereLight(0xffffff,0x556655,0.9));
const dl=new THREE.DirectionalLight(0xffffff,0.9); dl.position.set(50,100,30); scene.add(dl);
const grass=new THREE.Mesh(new THREE.PlaneGeometry(4000,4000),new THREE.MeshLambertMaterial({color:0x3f8f3f})); grass.rotation.x=-Math.PI/2; scene.add(grass);
const road=new THREE.Mesh(new THREE.PlaneGeometry(14,4000),new THREE.MeshLambertMaterial({color:0x3a3a3e})); road.rotation.x=-Math.PI/2; road.position.y=0.01; scene.add(road);
for(const s of [-1,1]){const l=new THREE.Mesh(new THREE.PlaneGeometry(0.25,4000),new THREE.MeshBasicMaterial({color:0xffffff})); l.rotation.x=-Math.PI/2; l.position.set(s*6.8,0.02,0); scene.add(l);
 const w=new THREE.Mesh(new THREE.BoxGeometry(0.4,1,4000),new THREE.MeshLambertMaterial({color:0x999999})); w.position.set(s*12.2,0.5,0); scene.add(w);}
for(let i=0;i<60;i++){const d=new THREE.Mesh(new THREE.PlaneGeometry(0.2,4),new THREE.MeshBasicMaterial({color:0xdddddd})); d.rotation.x=-Math.PI/2; d.position.set(0,0.02,i*12); scene.add(d);}
const cam=new THREE.PerspectiveCamera(70,W/H,0.5,4000);
const ck=F1.createCockpit(cam); scene.add(ck.group);
const st={x:+(q.get('x')||0),z:0,heading:0,speed:+(q.get('v')||0),steer:+(q.get('steer')||0),hit:0,onGrass:false};
for(let i=0;i<200;i++) ck.update(st,1/60);
if(q.get('ext')){ // external view for checking the model
  const c2=new THREE.PerspectiveCamera(45,W/H,0.1,1000); c2.position.set(3.5,2.6,5.5); c2.lookAt(0,0.4,0.8); r.render(scene,c2);
} else r.render(scene,cam);
document.title='done';
</script></body></html>
