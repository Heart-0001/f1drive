<!DOCTYPE html><html><body style="margin:0;overflow:hidden;background:#000"><canvas id="c"></canvas>
<script src="file:///C:/Users/user/Desktop/f1drive/lib/three.min.js"></script>
<script src="file:///C:/Users/user/Desktop/f1drive/tracks-data.js"></script>
<script src="file:///C:/Users/user/Desktop/f1drive/js/track.js"></script>
<script src="file:///C:/Users/user/Desktop/f1drive/js/car.js"></script>
<script src="file:///C:/Users/user/Desktop/f1drive/js/cockpit.js"></script>
<script>
try {
const q=new URLSearchParams(location.search);
const W=1280,H=720, SKY=0x87b8e8;
const r=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true});
r.setSize(W,H);
const scene=new THREE.Scene(); scene.background=new THREE.Color(SKY); scene.fog=new THREE.Fog(SKY,300,2500);
scene.add(new THREE.HemisphereLight(0xdcebff,0x556644,0.85));
const sun=new THREE.DirectionalLight(0xffffff,0.9); sun.position.set(300,600,200); scene.add(sun);
const name=(q.get('t')||'spa').toLowerCase();
const td=F1_TRACKS.find(t=>t.name.toLowerCase().includes(name)||t.id===name);
if(!td.elev || q.get('synth')){ // synthetic elevation
  const n=td.points.length, cum=[0]; for(let i=1;i<n;i++) cum.push(cum[i-1]+Math.hypot(td.points[i][0]-td.points[i-1][0],td.points[i][1]-td.points[i-1][1]));
  const L=cum[n-1]; td.elev=cum.map(s=>22+16*Math.sin(4*Math.PI*s/L)+6*Math.sin(14*Math.PI*s/L+1));
}
const track=F1.buildTrack(td); scene.add(track.group);
const S=track.samples, N=S.length;
let idx=+(q.get('i')||0);
if(q.get('find')){ // find=up | down | bankL | bankR | crest | cross
  let best=-1e9; const f=q.get('find');
  for(let i=0;i<N;i++){ const s=S[i]; let v;
    if(f==='up') v=s.grade; else if(f==='down') v=-s.grade; else if(f==='bankL') v=s.bank; else if(f==='bankR') v=-s.bank;
    else if(f==='crest') v=S[(i+N-15)%N].grade-S[(i+15)%N].grade; else v=0;
    if(v>best){best=v; idx=i;} }
  if(f==='cross' && track.crossings.length) idx=track.crossings[0][0];
  idx=(idx+N+(+(q.get('back')||-10)))%N;
}
const cam=new THREE.PerspectiveCamera(70,W/H,0.1,4000);
const ck=F1.createCockpit(cam); scene.add(ck.group);
const car=F1.createCar(); car.reset(track,idx);
const st=car.state;
const d=+(q.get('d')||0); st.x+=S[idx].nx*d; st.z+=S[idx].nz*d; st.heading+=+(q.get('h')||0);
st.speed=+(q.get('v')||0); st.steer=+(q.get('steer')||0);
// settle attitude without moving
const v0=st.speed; st.speed=0; for(let i=0;i<60;i++) car.update(1/120,{},track); st.speed=v0;
for(let i=0;i<200;i++) ck.update(st,1/60);
const s=S[st.sampleIndex];
const info=`idx ${st.sampleIndex} y ${st.y.toFixed(2)} pitch ${(st.pitch*57.3).toFixed(2)}deg roll ${(st.roll*57.3).toFixed(2)}deg | sample grade ${(s.grade*100).toFixed(1)}% bank ${(s.bank*57.3).toFixed(2)}deg halfW ${s.halfW.toFixed(1)} walls ${s.wallNegDist.toFixed(1)}/${s.wallPosDist.toFixed(1)}`;
if(q.get('ext')){
  const c2=new THREE.PerspectiveCamera(50,W/H,1,8000);
  const hgt=+(q.get('ext')), back=+(q.get('eb')||hgt), side=+(q.get('es')||0);
  c2.position.set(st.x-Math.sin(st.heading)*back+Math.cos(st.heading)*side, st.y+hgt, st.z-Math.cos(st.heading)*back-Math.sin(st.heading)*side);
  c2.lookAt(st.x,st.y,st.z); r.render(scene,c2);
} else r.render(scene,cam);
document.title='done '+info;
} catch(e){ document.title='ERR '+e.message+' '+(e.stack||''); }
</script></body></html>
